name: Update Google Scholar citations

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  group: google-scholar-citations
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install crawler dependencies
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch citation data
        env:
          GOOGLE_SCHOLAR_ID: "9IC8FBQAAAAJ"
        run: python google_scholar_crawler/main.py

      - name: Publish citation data branch
        working-directory: google-scholar-stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init --initial-branch=google-scholar-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Update Google Scholar citation data"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats
