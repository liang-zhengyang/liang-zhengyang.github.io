<script>
  document.addEventListener("DOMContentLoaded", function () {
    {% if site.google_scholar_stats_use_cdn %}
    const dataUrl = "https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/gs_data.json";
    {% else %}
    const dataUrl = "https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/gs_data.json";
    {% endif %}

    const normalizeTitle = (title) =>
      title.normalize("NFKD").toLowerCase().replace(/[^a-z0-9]+/g, "");

    const dailyCacheKey = new Date().toISOString().slice(0, 10);
    fetch(`${dataUrl}?v=${dailyCacheKey}`, { cache: "no-store" })
      .then((response) => {
        if (!response.ok) {
          throw new Error(`Citation data request failed: ${response.status}`);
        }
        return response.json();
      })
      .then((data) => {
        const totalCitation = document.getElementById("total_cit");
        if (totalCitation) {
          totalCitation.textContent = data.citedby;
        }

        const publications = data.publications || {};
        const publicationsByTitle = data.publications_by_title || {};
        document.querySelectorAll(".show_paper_citations").forEach((element) => {
          const publication =
            publications[element.dataset.scholarId] ||
            publicationsByTitle[normalizeTitle(element.dataset.title || "")];
          if (publication) {
            element.textContent = `| Citations: ${publication.num_citations}`;
          } else {
            element.textContent = "";
          }
        });
      })
      .catch((error) => console.warn("Unable to load Google Scholar citations.", error));
  });
</script>
